name: Publish bootstrap-producer image

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: publish-bootstrap-image-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/lambdasistemi/amaru-bootstrap-producer
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    name: Publish bootstrap-producer image
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' ||
        (github.event.workflow_run.event == 'pull_request' &&
         github.event.workflow_run.head_repository.full_name == github.repository))) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    runs-on: nixos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check Docker daemon
        run: nix --quiet shell nixpkgs#docker-client -c docker info

      - name: Build bootstrap-producer image
        run: >-
          nix build --quiet
          .#packages.x86_64-linux.bootstrap-producer-image
          -o result-bootstrap-producer-image

      - name: Load image
        run: >-
          nix --quiet shell nixpkgs#docker-client
          -c docker load -i result-bootstrap-producer-image

      - name: Tag image
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
        run: |
          nix --quiet shell nixpkgs#docker-client \
            -c docker tag amaru-bootstrap-producer:dev \
              "${IMAGE_NAME}:${SOURCE_SHA}"

          if [ -n "${PR_NUMBER}" ]; then
            nix --quiet shell nixpkgs#docker-client \
              -c docker tag amaru-bootstrap-producer:dev \
                "${IMAGE_NAME}:pr-${PR_NUMBER}-${SOURCE_SHA}"
          fi

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix --quiet shell nixpkgs#docker-client -c \
            docker login ghcr.io \
              -u "${GITHUB_ACTOR}" \
              --password-stdin <<<"${GHCR_TOKEN}"

      - name: Push image
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
        run: |
          nix --quiet shell nixpkgs#docker-client \
            -c docker push "${IMAGE_NAME}:${SOURCE_SHA}"

          if [ -n "${PR_NUMBER}" ]; then
            nix --quiet shell nixpkgs#docker-client \
              -c docker push "${IMAGE_NAME}:pr-${PR_NUMBER}-${SOURCE_SHA}"
          fi

      - name: Resolve published digest
        id: digest
        run: |
          digest=$(nix --quiet shell nixpkgs#skopeo \
            -c skopeo inspect \
              --format '{{.Digest}}' \
              "docker://${IMAGE_NAME}:${SOURCE_SHA}")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "published tag did not resolve to a sha256 digest" >&2
            exit 1
          fi
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Emit image publication receipt
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          job_id=$(nix --quiet shell nixpkgs#gh nixpkgs#jq \
            -c gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest" \
              --jq '.jobs[] | select(.name == "Publish bootstrap-producer image") | .id')
          if [[ ! "$job_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "could not resolve publication job identity" >&2
            exit 1
          fi
          reference="${IMAGE_NAME}:${SOURCE_SHA}@${DIGEST}"
          # shellcheck disable=SC2016
          nix --quiet shell nixpkgs#jq -c jq -S -n \
            --arg bootstrap_sha "$SOURCE_SHA" \
            --arg repository "$IMAGE_NAME" \
            --arg digest "$DIGEST" \
            --arg reference "$reference" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson job_id "$job_id" \
            '{
              bootstrap_sha: $bootstrap_sha,
              image: {
                digest: $digest,
                reference: $reference,
                repository: $repository,
                tag: $bootstrap_sha
              },
              publication: {
                conclusion: "success",
                head_sha: $bootstrap_sha,
                job_id: $job_id,
                repository: "lambdasistemi/amaru-bootstrap",
                run_attempt: $run_attempt,
                run_id: $run_id,
                workflow: "Publish bootstrap-producer image"
              },
              schema: "amaru-bootstrap-image-publication/v1"
            }' >image-publication-v1.json
          nix --quiet shell \
            nixpkgs#bash \
            nixpkgs#check-jsonschema \
            nixpkgs#coreutils \
            nixpkgs#jq \
            -c scripts/daily-amaru-handoff.sh \
              validate-image-receipt --file image-publication-v1.json

      - name: Upload image publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: image-publication-receipt-${{ env.SOURCE_SHA }}
          path: image-publication-v1.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarize published image
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
        run: |
          {
            echo "## Published bootstrap-producer image"
            echo
            echo "\`${IMAGE_NAME}:${SOURCE_SHA}@${{ steps.digest.outputs.digest }}\`"
            if [ -n "${PR_NUMBER}" ]; then
              echo
              echo "\`${IMAGE_NAME}:pr-${PR_NUMBER}-${SOURCE_SHA}\`"
            fi
          } >>"${GITHUB_STEP_SUMMARY}"
